name: Regenerate agent console and open-source table

on:
  schedule:            # every 6 hours
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/agent_console.py"
      - "scripts/open_source.py"
      - "scripts/stats.py"
      - ".github/workflows/agent-console.yml"

# never let two runs race for the same commit
concurrency:
  group: agent-console
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets/agent-console.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/agent_console.py

      - name: Render the open-source table into README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/open_source.py

      - name: Render assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stats.py

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README first: the console's timestamp-only early exits below must
          # not swallow a real change to the open-source table. Both
          # open_source.py and stats.py write to it -- the table, and the
          # stats image's alt text.
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "Refresh open-source table and stats alt text"
            git push
          fi
          # stats.svg carries no timestamp, so any diff is a real one.
          if ! git diff --quiet -- assets/stats.svg; then
            git add assets/stats.svg
            git commit -m "Refresh contribution stats"
            git push
          fi
          # the timestamp alone changes every run; only commit real content changes
          if git diff --quiet -- assets/agent-console.svg; then
            echo "no change"; exit 0
          fi
          changed=$(git diff -U0 -- assets/agent-console.svg \
                    | grep -E '^[+-]' | grep -v '^[+-][+-]' \
                    | grep -vc 'regenerated ' || true)
          if [ "$changed" -eq 0 ]; then
            echo "timestamp-only change, skipping commit"
            git checkout -- assets/agent-console.svg
            exit 0
          fi
          git add assets/agent-console.svg
          git commit -m "Refresh agent console"
          git push
