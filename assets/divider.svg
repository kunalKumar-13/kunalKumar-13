<svg xmlns="http://www.w3.org/2000/svg" width="880" height="6" viewBox="0 0 880 6" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2.5" width="880" height="1" fill="url(#base)"/>
  <rect x="-220" y="2" width="220" height="2" rx="1" fill="url(#pulse)">
    <animate attributeName="x" values="-220;880" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
