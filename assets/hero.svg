<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" fill="none" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"><animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#7aa2f7" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#bb9af7"><animate attributeName="stop-color" values="#bb9af7;#7dcfff;#7aa2f7;#bb9af7" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7dcfff"><animate attributeName="stop-color" values="#7dcfff;#7aa2f7;#bb9af7;#7dcfff" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dcfff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="type"><rect x="46" y="150" width="0" height="30">
      <animate attributeName="width" values="0;0;486;486;0" keyTimes="0;0.05;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="panel"><rect x="1" y="1" width="878" height="258" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="258" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <g clip-path="url(#panel)">
    <!-- drifting particles -->
    <g fill="#7aa2f7">
      <circle cx="120" cy="40" r="1.6" opacity="0.5"><animate attributeName="cy" values="40;220;40" dur="17s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.6;0.1" dur="17s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="200" r="1.3" opacity="0.4"><animate attributeName="cy" values="200;30;200" dur="21s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="70" r="1.8" opacity="0.35"><animate attributeName="cy" values="70;230;70" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="210" r="1.2" opacity="0.45"><animate attributeName="cy" values="210;50;210" dur="19s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="120" r="1.5" opacity="0.3"><animate attributeName="cy" values="120;20;120" dur="23s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#bb9af7">
      <circle cx="200" cy="150" r="1.2" opacity="0.4"><animate attributeName="cy" values="150;20;150" dur="25s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="180" r="1.4" opacity="0.35"><animate attributeName="cy" values="180;40;180" dur="16s" repeatCount="indefinite"/></circle>
    </g>
    <!-- sweeping light bar -->
    <rect x="-300" y="0" width="300" height="260" fill="url(#sweep)" opacity="0.07">
      <animate attributeName="x" values="-300;880" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- corner brackets -->
  <g stroke="#bb9af7" stroke-width="2" fill="none" opacity="0.55">
    <path d="M24 44 V24 H44"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="4s" repeatCount="indefinite"/></path>
    <path d="M856 216 V236 H836"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="4s" repeatCount="indefinite"/></path>
  </g>

  <text x="48" y="98" font-size="52" font-weight="800" fill="url(#g1)" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" letter-spacing="-1.5">Kunal Kumar</text>
  <rect x="50" y="118" width="0" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" values="0;360" dur="1.1s" begin="0.2s" fill="freeze"/>
  </rect>

  <g clip-path="url(#type)">
    <text x="50" y="170" font-size="19" fill="#a9b1d6">I build AI agents, RAG systems &amp; developer tooling</text>
  </g>
  <rect x="50" y="153" width="10" height="23" fill="#7dcfff">
    <animate attributeName="x" values="50;50;536;536;50" keyTimes="0;0.05;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <text x="50" y="208" font-size="12.5" fill="#565f89">SWE Intern @ Emergent (YC S24)</text>
  <text x="50" y="230" font-size="12.5" fill="#565f89">CS @ Scaler School of Technology × BITS Pilani  ·  Bengaluru, India</text>

  <!-- monogram with pulsing ring -->
  <g>
    <rect x="738" y="76" width="104" height="104" rx="22" fill="none" stroke="#bb9af7" stroke-width="2"/>
    <g transform="translate(790 128)">
      <rect x="-52" y="-52" width="104" height="104" rx="22" fill="none" stroke="#7dcfff" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="790" y="130" text-anchor="middle" fill="url(#g1)" font-size="42" font-weight="700" letter-spacing="1">KK</text>
  </g>
</svg>
