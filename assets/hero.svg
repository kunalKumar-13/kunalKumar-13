<svg xmlns="http://www.w3.org/2000/svg" width="880" height="288" viewBox="0 0 880 288" fill="none" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="0.62" stop-color="#c8d3f5"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.55" stop-color="#bb9af7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="878" height="286" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- ── left column: the nameplate ─────────────────────────────── -->

  <circle cx="58" cy="50" r="3" fill="#7dcfff"/>
  <text x="70" y="54" font-size="11" fill="#565f89" letter-spacing="2.4">SWE INTERN · EMERGENT (YC S24)</text>

  <text x="54" y="126" font-size="54" font-weight="800" letter-spacing="-1.6" fill="url(#name)"
        font-family="-apple-system,'Segoe UI',system-ui,sans-serif">Kunal Kumar</text>

  <rect x="56" y="146" width="0" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" values="0;330" dur="1.15s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <text x="56" y="184" font-size="18" fill="#a9b1d6"
        font-family="-apple-system,'Segoe UI',system-ui,sans-serif">I build AI agents, RAG systems &amp; developer tooling</text>

  <g font-size="10" fill="#565f89" letter-spacing="1.6">
    <text x="56" y="224">NOW</text>
    <text x="56" y="246">STUDYING</text>
    <text x="56" y="268">BASED</text>
  </g>
  <g font-size="13" fill="#a9b1d6" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
    <text x="152" y="224">Software engineering intern at Emergent</text>
    <text x="152" y="246">CS · Scaler School of Technology × BITS Pilani</text>
    <text x="152" y="268">Bengaluru, India</text>
  </g>

  <!-- ── right: the agent loop — perceive, decide, act ───────────── -->

  <ellipse cx="760" cy="152" rx="124" ry="112" fill="url(#glow)"/>

  <path d="M706 92 L812 152 L706 212 Z" stroke="#30363d" stroke-width="1.5" fill="none"/>

  <g font-size="9.5" fill="#565f89" letter-spacing="0.8">
    <text x="692" y="96" text-anchor="end">perceive</text>
    <text x="826" y="156" text-anchor="start">decide</text>
    <text x="692" y="216" text-anchor="end">act</text>
  </g>

  <g fill="#0d1117" stroke-width="2">
    <circle cx="706" cy="92" r="5.5" stroke="#7aa2f7"/>
    <circle cx="812" cy="152" r="5.5" stroke="#bb9af7"/>
    <circle cx="706" cy="212" r="5.5" stroke="#7dcfff"/>
  </g>

  <!-- the single moving part: one signal, making the round trip -->
  <circle r="3.5" fill="#7dcfff">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear"
                   path="M706 92 L812 152 L706 212 Z"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.06;0.5;0.94;1" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
