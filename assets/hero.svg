<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="Kunal Kumar. Software engineer and open-source maintainer. Area Approver for Release, Security and Infrastructure at Music Blocks (Sugar Labs). Experience: Pronto, Emergent (YC S24), Ostrius AI. Education: Computer Science, BITS Pilani.">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset="0.5" stop-color="#bb9af7"/><stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/><stop offset="0.5" stop-color="#7aa2f7" stop-opacity="0.55"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="halo" cx="0.88" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.16"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="880" height="270" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="270" fill="#0f131c"/>
    <rect width="880" height="270" fill="url(#grid)"/>
    <rect width="880" height="270" fill="url(#halo)"/>
    <rect x="0" y="0" width="880" height="1.5" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="269" rx="16" fill="none" stroke="#30363d"/>

  <!-- left column -->
  <text x="56" y="62" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="12" letter-spacing="2.2" fill="#7aa2f7">SOFTWARE ENGINEER  ·  OPEN SOURCE</text>
  <text x="54" y="118" font-family="'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="50" letter-spacing="-0.5" fill="#e6edf3">Kunal Kumar</text>
  <text x="56" y="152" font-family="'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" fill="#c0caf5">Area Approver, Release, Security &amp; Infrastructure at Music Blocks (Sugar Labs)</text>

  <rect x="56" y="178" width="640" height="1" fill="#30363d"/>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5">
    <text x="56" y="208" fill="#565f89" letter-spacing="1.5">EXPERIENCE</text>
    <text x="170" y="208" fill="#a9b1d6">Pronto  ·  Emergent (YC S24)  ·  Ostrius AI</text>
    <text x="56" y="232" fill="#565f89" letter-spacing="1.5">EDUCATION</text>
    <text x="170" y="232" fill="#a9b1d6">Computer Science  ·  BITS Pilani</text>
  </g>

  <!-- emblem -->
  <g transform="translate(790 112)">
    <circle r="62" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="2 7" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="#0f131c" stroke="url(#ring)" stroke-width="1.6"/>
    <text y="10" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-weight="600" font-size="28" letter-spacing="1" fill="url(#ring)">KK</text>
  </g>
  <text x="790" y="232" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#565f89">India · remote</text>
</svg>
