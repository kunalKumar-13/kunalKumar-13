<svg xmlns="http://www.w3.org/2000/svg" width="820" height="120" viewBox="0 0 820 120" fill="none" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <clipPath id="reveal"><rect x="28" y="52" width="764" height="26" rx="13">
      <animate attributeName="width" values="0;764" keyTimes="0;1" dur="1.3s" begin="0.2s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <rect x="1" y="1" width="818" height="118" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="28" y="32" font-size="15" font-weight="700" fill="#7aa2f7">Languages</text>
  <text x="120" y="33" font-size="11.5" fill="#7d8590">· by bytes across public repos</text>

  <!-- stacked bar: real distribution, clipped to a rounded rect that wipes in -->
  <g clip-path="url(#reveal)">
    <rect x="28"    y="52" width="340.0" height="26" fill="#3572A5"/>
    <rect x="368.0" y="52" width="197.9" height="26" fill="#3178c6"/>
    <rect x="565.9" y="52" width="71.8"  height="26" fill="#f1e05a"/>
    <rect x="637.7" y="52" width="61.1"  height="26" fill="#e34c26"/>
    <rect x="698.8" y="52" width="43.5"  height="26" fill="#563d7c"/>
    <rect x="742.3" y="52" width="49.7"  height="26" fill="#6e7681"/>
  </g>

  <!-- legend -->
  <g font-size="12" dominant-baseline="middle">
    <circle cx="34"  cy="100" r="5" fill="#3572A5"/><text x="44"  y="100" fill="#e6edf3">Python <tspan fill="#7d8590">44.5%</tspan></text>
    <circle cx="150" cy="100" r="5" fill="#3178c6"/><text x="160" y="100" fill="#e6edf3">TypeScript <tspan fill="#7d8590">25.9%</tspan></text>
    <circle cx="300" cy="100" r="5" fill="#f1e05a"/><text x="310" y="100" fill="#e6edf3">JavaScript <tspan fill="#7d8590">9.4%</tspan></text>
    <circle cx="440" cy="100" r="5" fill="#e34c26"/><text x="450" y="100" fill="#e6edf3">HTML <tspan fill="#7d8590">8.0%</tspan></text>
    <circle cx="530" cy="100" r="5" fill="#563d7c"/><text x="540" y="100" fill="#e6edf3">CSS <tspan fill="#7d8590">5.7%</tspan></text>
    <circle cx="620" cy="100" r="5" fill="#6e7681"/><text x="630" y="100" fill="#e6edf3">Other <tspan fill="#7d8590">6.5%</tspan></text>
  </g>
</svg>
