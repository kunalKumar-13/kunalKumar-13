    <rect x="752.4" y="52" width="39.6"  height="26" fill="#6e7681"/>
  </g>

  <g font-size="12" dominant-baseline="middle">
    <circle cx="34"  cy="100" r="5" fill="#3572A5"/><text x="44"  y="100" fill="#e6edf3">Python <tspan fill="#7d8590">51.3%</tspan></text>
