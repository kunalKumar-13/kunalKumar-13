<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150" viewBox="0 0 240 150" fill="none">
  <defs>
    <clipPath id="head"><circle cx="82" cy="76" r="34"/></clipPath>
  </defs>

  <!-- floor shadow (neutral so it reads on light and dark) -->
  <ellipse cx="130" cy="126" rx="76" ry="6.5" fill="#8b949e" opacity="0.16"/>

  <!-- far leg, stretched out flat -->
  <path d="M186 112 C 202 116, 214 116, 223 114" stroke="#e0b48f" stroke-width="12"
        stroke-linecap="round" fill="none"/>
  <ellipse cx="227" cy="113" rx="7.5" ry="5.5" fill="#e0b48f" transform="rotate(-8 227 113)"/>

  <!-- near leg, kicked up (drawn with an outline so it reads in front) -->
  <path d="M180 102 L 206 97 L 198 70" stroke="#dda57e" stroke-width="15.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M180 102 L 206 97 L 198 70" stroke="#f7d3ae" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <ellipse cx="196" cy="66" rx="8.5" ry="6" fill="#f7d3ae" stroke="#dda57e" stroke-width="1.2"
           transform="rotate(-20 196 66)"/>

  <!-- shorts -->
  <ellipse cx="176" cy="105" rx="25" ry="18" fill="#eec643"/>
  <path d="M156 113 q20 8 40 -3" stroke="#d9ad34" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- shirt -->
  <ellipse cx="132" cy="102" rx="42" ry="20" fill="#e8453c">
    <animate attributeName="ry" values="20;21.2;20" dur="4.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="102" cy="104" rx="13.5" ry="12.5" fill="#e8453c"/>
  <path d="M108 92 q26 -5 50 4" stroke="#c93a32" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- forearms -->
  <path d="M102 109 C 95 114, 90 117, 86 117" stroke="#e0b48f" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M98 106 C 90 110, 82 113, 76 113" stroke="#f7d3ae" stroke-width="11" stroke-linecap="round" fill="none"/>

  <!-- head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1.5;0 0" dur="4.4s" repeatCount="indefinite"/>
    <circle cx="82" cy="76" r="34" fill="#f7d3ae"/>

    <g clip-path="url(#head)">
      <!-- bowl cut -->
      <ellipse cx="82" cy="44" rx="38" ry="25" fill="#32323a"/>
      <!-- blush -->
      <ellipse cx="55" cy="98" rx="6.5" ry="3.6" fill="#f7768e" opacity="0.3"/>
      <ellipse cx="109" cy="98" rx="6.5" ry="3.6" fill="#f7768e" opacity="0.3"/>
    </g>

    <!-- the eyebrows -->
    <rect x="56" y="73" width="22" height="7" rx="3.5" fill="#32323a" transform="rotate(-7 67 76.5)"/>
    <rect x="86" y="73" width="22" height="7" rx="3.5" fill="#32323a" transform="rotate(7 97 76.5)"/>

    <!-- eyes -->
    <ellipse cx="68" cy="89" rx="7" ry="8" fill="#ffffff" stroke="#32323a" stroke-width="1.2"/>
    <ellipse cx="96" cy="89" rx="7" ry="8" fill="#ffffff" stroke="#32323a" stroke-width="1.2"/>
    <ellipse cx="68" cy="90" rx="4.2" ry="5.2" fill="#1e1e24"/>
    <ellipse cx="96" cy="90" rx="4.2" ry="5.2" fill="#1e1e24"/>
    <circle cx="66.4" cy="87.6" r="1.4" fill="#ffffff"/>
    <circle cx="94.4" cy="87.6" r="1.4" fill="#ffffff"/>

    <!-- nose + lazy smirk -->
    <ellipse cx="82" cy="97" rx="2.2" ry="1.8" fill="#dda57e"/>
    <path d="M72 101 q10 8 20 -1" stroke="#8a4a33" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- hands propping up the chin -->
  <ellipse cx="95" cy="118" rx="9" ry="7" fill="#e0b48f"/>
  <ellipse cx="73" cy="115" rx="10.5" ry="7.5" fill="#f7d3ae" stroke="#dda57e" stroke-width="1.2"/>
</svg>
